<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Original Plover icon: minimal wireframe piping plover above a dashed
       TSP route. 100% original vector art (no photographic source). -->
  <g fill="none" stroke="#2B3540" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Body + head outline (single contour, side profile facing right) -->
    <path d="M14,46
             C16,33 34,25 52,25
             C62,24 66,19 72,21
             L90,28 L74,31
             C66,34 64,39 60,43
             C55,51 43,56 30,54
             C20,53 15,51 14,46 Z"/>
    <!-- Folded wing (interior line) -->
    <path d="M28,42 C39,37 52,39 59,44"/>
    <!-- Legs + feet -->
    <path d="M44,55 L42,69 M40,69 L46,69"/>
    <path d="M53,54 L53,69 M50,69 L56,69"/>
  </g>

  <!-- Eye -->
  <circle cx="70" cy="28" r="2" fill="#2B3540"/>

  <!-- Route motif: dashed path with hollow waypoint dots -->
  <path d="M12,82 C28,74 40,92 56,84 C68,78 78,90 86,82" fill="none"
        stroke="#E8590C" stroke-width="2.4" stroke-linecap="round"
        stroke-dasharray="0.1 6"/>
  <g fill="none" stroke="#E8590C" stroke-width="2">
    <circle cx="12" cy="82" r="3.2"/>
    <circle cx="40" cy="86" r="3.2"/>
    <circle cx="62" cy="83" r="3.2"/>
    <circle cx="86" cy="82" r="3.2"/>
  </g>
</svg>
